[build]
  base = "frontend"
  command = "rm -rf .next && npm run build"
  publish = ".next"

# Environment variables are now set in Netlify UI
# Site settings → Environment variables
# Required variables:
#   - NEXT_PUBLIC_API_URL (production: https://api.lapwise.dev)
#   - NEXT_PUBLIC_API_KEY (set after generating new key)

# Temporarily disable secrets scanning during API key rotation
# Ignores old key value and cache directories that may contain it
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "754b5a8e5c6c17f92026f9fedbe15bf58fbb0af80c3706098d0da7701327ad26"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**,.next/cache/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"
