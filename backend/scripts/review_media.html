<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lapwise media review</title>
<style>
  :root {
    --bg: #0d0f12; --panel: #15181d; --line: #262b33;
    --text: #e8eaed; --muted: #8a929e; --ok: #37b47e; --no: #d4574a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 12px 20px;
    display: flex; gap: 20px; align-items: center;
  }
  h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .01em; }
  .counts { color: var(--muted); font-variant-numeric: tabular-nums; }
  .keys { margin-left: auto; color: var(--muted); font-size: 11px; }
  kbd {
    background: #222831; border: 1px solid var(--line); border-radius: 3px;
    padding: 1px 5px; font: 11px ui-monospace, monospace;
  }
  main { padding: 20px; display: grid; gap: 16px;
         grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    overflow: hidden; transition: border-color .12s, opacity .2s;
  }
  .card.focused { border-color: #4a7cd4; }
  .card.done { opacity: .25; }
  .imgs { display: flex; gap: 1px; background: var(--line); }
  .full { flex: 1; aspect-ratio: 3/4; overflow: hidden; background: #000; }
  .full img { width: 100%; height: 100%; object-fit: contain; cursor: crosshair; }
  .crop { width: 96px; background: #000; }
  .crop-box {
    width: 96px; height: 96px; background-size: cover; background-position: 50% 40%;
    border-bottom: 1px solid var(--line);
  }
  .crop-label {
    font: 11px ui-monospace, monospace; color: var(--muted);
    text-align: center; padding: 4px 0;
  }
  .meta { padding: 10px 12px; }
  /* The name is the only text scanned at speed; metadata is reference. */
  .name { font-size: 18px; font-weight: 600; line-height: 1.25; margin-bottom: 3px; }
  .sub { color: var(--muted); font-size: 14px; }
  .lic {
    display: inline-block; margin-top: 6px; padding: 1px 6px; border-radius: 3px;
    background: #1e2530; color: #9fb4d4; font: 11px ui-monospace, monospace;
  }
  .credit {
    color: var(--muted); font-size: 11px; margin-top: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .actions { display: flex; gap: 1px; background: var(--line); margin-top: 10px; }
  button {
    flex: 1; border: 0; padding: 9px; cursor: pointer; font: inherit;
    font-size: 14px; background: #1b2027; color: var(--text);
  }
  button:hover { background: #232a33; }
  button.ok:hover { background: var(--ok); color: #08130d; }
  button.no:hover { background: var(--no); color: #1a0806; }
  a { color: #7fa8e8; }
  .empty { padding: 60px 20px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Media review</h1>
  <span class="counts" id="counts">loading…</span>
  <span class="keys">
    <kbd>A</kbd> approve · <kbd>R</kbd> reject · <kbd>J</kbd>/<kbd>K</kbd> move ·
    click face to set focal point
  </span>
</header>
<main id="grid"></main>

<script>
let items = [], focused = 0;

async function load() {
  items = await (await fetch('/api/pending')).json();
  render();
  refreshCounts();
}

async function refreshCounts() {
  const s = await (await fetch('/api/stats')).json();
  document.getElementById('counts').textContent =
    `${s.pending ?? 0} pending · ${s.approved ?? 0} approved · ${s.removed ?? 0} rejected`;
}

function render() {
  const grid = document.getElementById('grid');
  if (!items.length) {
    grid.innerHTML = '<div class="empty">Nothing pending. Run the bulk ingest first.</div>';
    return;
  }
  grid.innerHTML = items.map((it, i) => `
    <div class="card ${i === focused ? 'focused' : ''}" data-i="${i}" id="card-${i}">
      <div class="imgs">
        <div class="full"><img src="${it.url}" alt="" data-i="${i}"></div>
        <div class="crop">
          <div class="crop-box" id="crop-${i}" style="background-image:url('${it.url}')"></div>
          <div class="crop-label">96px</div>
        </div>
      </div>
      <div class="meta">
        <div class="name">${it.driver}</div>
        <div class="sub">${it.width}×${it.height} · ${it.role}${it.year ? ' · ' + it.year : ' · career'}</div>
        <span class="lic">${it.license}</span>
        <div class="credit" title="${(it.credit || '').replace(/"/g, '&quot;')}">${it.credit || ''}</div>
        <div class="credit"><a href="${it.source}" target="_blank" rel="noopener">Commons page</a></div>
      </div>
      <div class="actions">
        <button class="ok" data-act="ok" data-i="${i}">Approve</button>
        <button class="no" data-act="no" data-i="${i}">Reject</button>
      </div>
    </div>`).join('');
}

// Clicking the face sets the focal point and re-frames the square preview.
document.addEventListener('click', (e) => {
  const img = e.target.closest('.full img');
  if (img) {
    const i = +img.dataset.i, r = img.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    items[i].focal_x = Math.min(1, Math.max(0, x));
    items[i].focal_y = Math.min(1, Math.max(0, y));
    document.getElementById('crop-' + i).style.backgroundPosition =
      `${items[i].focal_x * 100}% ${items[i].focal_y * 100}%`;
    return;
  }
  const btn = e.target.closest('button[data-act]');
  if (btn) decide(+btn.dataset.i, btn.dataset.act === 'ok');
});

async function decide(i, approved) {
  const it = items[i];
  if (!it || it.done) return;
  it.done = true;
  document.getElementById('card-' + i).classList.add('done');
  await fetch('/api/decide', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      asset_id: it.asset_id, approved,
      focal_x: it.focal_x ?? null, focal_y: it.focal_y ?? null,
    }),
  });
  refreshCounts();
  if (i === focused) move(1);
}

function move(delta) {
  const next = focused + delta;
  if (next < 0 || next >= items.length) return;
  document.getElementById('card-' + focused)?.classList.remove('focused');
  focused = next;
  const el = document.getElementById('card-' + focused);
  el?.classList.add('focused');
  el?.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase();
  if (k === 'a') { decide(focused, true); e.preventDefault(); }
  else if (k === 'r') { decide(focused, false); e.preventDefault(); }
  else if (k === 'j' || e.key === 'ArrowDown') { move(1); e.preventDefault(); }
  else if (k === 'k' || e.key === 'ArrowUp') { move(-1); e.preventDefault(); }
});

load();
</script>
</body>
</html>
