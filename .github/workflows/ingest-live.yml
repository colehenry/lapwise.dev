name: Auto-Ingest F1 Sessions

on:
  schedule:
    # Every six hours, every day — includes the post-race recovery window when
    # FastF1 timing data can arrive after classification results.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Season year'
        required: false
        type: number
      round:
        description: 'Round number'
        required: false
        type: number
      session_type:
        description: 'Session type (race, qualifying, fp1, fp2, fp3, sprint_race, sprint_qualifying)'
        required: false
        type: string
      force:
        description: 'Replace an incomplete or incorrect existing session'
        required: false
        type: boolean
        default: false
      target_database:
        description: 'Target database'
        required: true
        type: choice
        options:
          - prod
          - dev
        default: prod

jobs:
  check-and-ingest:
    runs-on: ubuntu-latest
    # Covers the ingest retry window plus replay generation for race sessions.
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set environment variables
        run: |
          if [ "${{ inputs.target_database }}" = "dev" ]; then
            echo "DATABASE_URL=${{ secrets.NEON_DEV_DATABASE_URL }}" >> $GITHUB_ENV
          else
            echo "DATABASE_URL=${{ secrets.NEON_PROD_DATABASE_URL }}" >> $GITHUB_ENV
          fi
          echo "LAPWISE_API_KEY=${{ secrets.LAPWISE_API_KEY }}" >> $GITHUB_ENV
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> $GITHUB_ENV
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> $GITHUB_ENV

      - name: Create cache directory
        run: mkdir -p backend/.fastf1_cache

      - name: Restore FastF1 cache
        uses: actions/cache@v4
        with:
          path: backend/.fastf1_cache
          key: fastf1-cache-live-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            fastf1-cache-live-
            fastf1-cache-

      - name: Run database migrations
        working-directory: ./backend
        run: alembic upgrade head

      # ── Scheduled mode: auto-detect which session to ingest ──
      - name: Check for ready sessions
        if: ${{ !inputs.year }}
        id: check
        working-directory: ./backend
        run: PYTHONPATH=$PWD python scripts/check_ready_sessions.py

      - name: Ingest detected session (with retries)
        if: ${{ !inputs.year && steps.check.outputs.should_ingest == 'true' }}
        working-directory: ./backend
        env:
          INGEST_YEAR: ${{ steps.check.outputs.year }}
          INGEST_ROUND: ${{ steps.check.outputs.round }}
          INGEST_TYPE: ${{ steps.check.outputs.session_type }}
        run: |
          echo "Ingesting: $INGEST_YEAR R$INGEST_ROUND $INGEST_TYPE"
          ATTEMPT=0
          MAX_ATTEMPTS=6
          WAIT_SECONDS=1200

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "--- Attempt $ATTEMPT of $MAX_ATTEMPTS ---"

            if PYTHONPATH=$PWD python scripts/ingest_single.py $INGEST_YEAR $INGEST_ROUND $INGEST_TYPE; then
              echo "✅ Ingestion successful!"
              exit 0
            fi

            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "⏳ Retrying in $((WAIT_SECONDS / 60)) minutes..."
              sleep $WAIT_SECONDS
            fi
          done

          echo "❌ All $MAX_ATTEMPTS attempts failed"
          exit 1

      - name: Skip (no sessions ready)
        if: ${{ !inputs.year && steps.check.outputs.should_ingest != 'true' }}
        run: echo "No sessions ready for ingestion. Exiting."

      # ── Manual mode: ingest specific session ──
      - name: Ingest specific session (manual)
        if: ${{ inputs.year }}
        working-directory: ./backend
        run: |
          echo "Manual ingestion: ${{ inputs.year }} R${{ inputs.round }} ${{ inputs.session_type }}"
          PYTHONPATH=$PWD python scripts/ingest_single.py \
            ${{ inputs.year }} ${{ inputs.round }} ${{ inputs.session_type }} ${{ inputs.force && '--force' || '' }}

      # ── Replay frames (races only) ──
      # Runs in the same job so it reuses the telemetry the ingest step just
      # cached. Without this a race has no replay until someone runs the script
      # by hand.
      - name: Generate replay data
        if: >-
          ${{ (!inputs.year && steps.check.outputs.should_ingest == 'true'
               && steps.check.outputs.session_type == 'race')
              || (inputs.year && inputs.session_type == 'race') }}
        working-directory: ./backend
        env:
          REPLAY_YEAR: ${{ inputs.year || steps.check.outputs.year }}
          REPLAY_ROUND: ${{ inputs.round || steps.check.outputs.round }}
        run: |
          echo "Generating replay for $REPLAY_YEAR R$REPLAY_ROUND"
          PYTHONPATH=$PWD python scripts/ingest_replays.py \
            $REPLAY_YEAR $REPLAY_ROUND ${{ inputs.force && '--force' || '' }}

      - name: Refresh archive aggregates
        if: >-
          ${{ (!inputs.year && steps.check.outputs.should_ingest == 'true')
              || inputs.year }}
        working-directory: ./backend
        run: PYTHONPATH=$PWD python scripts/refresh_archive_aggregates.py
