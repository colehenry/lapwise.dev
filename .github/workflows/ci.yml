name: ci

on:
  pull_request:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../build.log

      - name: Bundle budgets
        working-directory: .
        run: node scripts/perf/bundle-report.mjs --log build.log --budget scripts/perf/bundle-budget.json

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  backend:
    name: Backend migrations and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: lapwise_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/lapwise_ci
      SECRET_KEY: ci-secret-key
      LAPWISE_API_KEY: ci-api-key
      FRONTEND_URL: http://localhost:3000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check installed packages
        run: pip check

      - name: Lint and format check
        run: |
          ruff check app/
          ruff format --check .

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest tests -q

  guardrails:
    name: Repository guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The commit-message attribution check reads full history; a shallow
          # clone would leave it silently unable to see anything.
          fetch-depth: 0

      - name: Test guardrails
        run: npm run check:guardrails

      - name: Guardrails report
        run: npm run guardrails
