name: deploy frontend

on:
  workflow_dispatch:

jobs:
  preflight:
    name: Verify frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Netlify secrets
        run: |
          echo "Checking if Netlify secrets are configured..."
          if [ -z "${{ secrets.NETLIFY_BUILD_HOOK }}" ]; then
            echo "ERROR: NETLIFY_BUILD_HOOK is not set"
            exit 1
          fi
          echo "All Netlify secrets are set"

      - name: Trigger Netlify deploy
        run: |
          echo "Netlify build hooks deploy the branch configured in Netlify, not automatically this checked-out commit."
          curl -X POST -d {} "https://api.netlify.com/build_hooks/${{ secrets.NETLIFY_BUILD_HOOK }}"
          echo "Netlify build triggered successfully"
          echo "View deployment at: https://app.netlify.com/sites/${{ secrets.NETLIFY_SITE_ID }}/deploys"

      - name: Smoke check current production frontend
        run: |
          for url in https://lapwise.dev https://lapwise.dev/results https://lapwise.dev/replay; do
            echo "Checking $url"
            curl -fsSIL "$url" >/dev/null
          done
