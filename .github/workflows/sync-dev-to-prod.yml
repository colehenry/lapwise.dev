name: sync dev db → prod db

on:
  workflow_dispatch:

jobs:
  sync-databases:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Normalize database URLs
        env:
          DEV_DATABASE_URL: ${{ secrets.NEON_DEV_DATABASE_URL }}
          PROD_DATABASE_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${DEV_DATABASE_URL:-}" ] || [ -z "${PROD_DATABASE_URL:-}" ]; then
            echo "ERROR: Missing NEON_DEV_DATABASE_URL or NEON_PROD_DATABASE_URL secret"
            exit 1
          fi

          normalize_url() {
            local input="$1"
            # Convert SQLAlchemy async URL to libpq URL used by pg_dump/psql/pg_restore
            local out="${input/postgresql+asyncpg:/postgresql:}"
            # Neon URLs commonly use ssl=require; libpq expects sslmode=require
            out="${out/ssl=require/sslmode=require}"
            printf '%s\n' "$out"
          }

          DEV_PG_URL="$(normalize_url "$DEV_DATABASE_URL")"
          PROD_PG_URL="$(normalize_url "$PROD_DATABASE_URL")"

          {
            echo "DEV_PG_URL=$DEV_PG_URL"
            echo "PROD_PG_URL=$PROD_PG_URL"
          } >> "$GITHUB_ENV"

          echo "Normalized database URLs for PostgreSQL client tools"

      - name: Dump dev database
        run: |
          set -euo pipefail
          echo "Dumping dev database..."
          echo "Dev DB host: $(echo "$DEV_PG_URL" | sed -E 's#.*@([^/?]+).*#\1#')"
          pg_dump --dbname="$DEV_PG_URL" --clean --if-exists --no-owner --no-acl -f dev_dump.sql
          echo "Dev dump complete ($(wc -l < dev_dump.sql) lines)"
          echo ""
          echo "Checking dump contents..."
          echo "DROP TABLE statements: $(grep -c 'DROP TABLE' dev_dump.sql || echo 0)"
          echo "CREATE TABLE statements: $(grep -c 'CREATE TABLE' dev_dump.sql || echo 0)"
          echo "INSERT statements: $(grep -c '^INSERT' dev_dump.sql || echo 0)"
          echo ""
          echo "First 50 lines of dump:"
          head -50 dev_dump.sql

      - name: Restore to production database
        run: |
          set -euo pipefail
          echo "⚠️  WARNING: Restoring to PRODUCTION database ⚠️"
          echo "Production DB host: $(echo "$PROD_PG_URL" | sed -E 's#.*@([^/?]+).*#\1#')"
          echo "This will drop existing tables and recreate them with dev data"
          echo ""
          psql "$PROD_PG_URL" -f dev_dump.sql 2>&1 | tee restore_output.log
          exit_code=$?
          echo ""
          echo "Restore exit code: $exit_code"
          if [ $exit_code -ne 0 ]; then
            echo "ERROR: Restore failed!"
            echo "Restore output:"
            cat restore_output.log
            exit $exit_code
          else
            echo "Restore completed successfully"
            echo "Last 20 lines of restore output:"
            tail -20 restore_output.log
          fi

      - name: Verify sync
        run: |
          set -euo pipefail
          echo "Waiting 5 seconds for Neon connection pooler to sync..."
          sleep 5
          echo ""
          echo "Verifying connection to production database..."
          echo "Production DB host: $(echo "$PROD_PG_URL" | sed -E 's#.*@([^/?]+).*#\1#')"
          psql "$PROD_PG_URL" -c "SELECT version();" || { echo "ERROR: Cannot connect to production database"; exit 1; }
          echo ""
          echo "Verifying data..."
          echo "Tables in production database:"
          psql "$PROD_PG_URL" -c "\dt public.*"
          echo ""
          echo "Row counts:"
          psql "$PROD_PG_URL" -c "SELECT 'drivers' as table_name, COUNT(*) as rows FROM public.drivers
                                  UNION ALL SELECT 'teams', COUNT(*) FROM public.teams
                                  UNION ALL SELECT 'sessions', COUNT(*) FROM public.sessions
                                  UNION ALL SELECT 'session_results', COUNT(*) FROM public.session_results
                                  UNION ALL SELECT 'laps', COUNT(*) FROM public.laps;"

      - name: Summary
        run: |
          echo "✅ Database sync complete"
          echo "Dev data has been copied to production database"
