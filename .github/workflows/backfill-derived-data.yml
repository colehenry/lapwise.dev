name: Backfill Derived Data

# Manual only. Race control messages and replay frames are derived from FastF1
# and can be regenerated at any time. Runs here rather than locally because the
# F1 livetiming host is not reachable from every network.
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'What to backfill'
        required: true
        type: choice
        options:
          - race-control
          - replays
        default: race-control
      years:
        description: 'race-control only — year or range, e.g. 2026 or 2018-2026'
        required: false
        type: string
        default: '2026'
      season:
        description: 'replays only — season year'
        required: false
        type: number
      round:
        description: 'replays only — single round (blank runs the whole season)'
        required: false
        type: number
      force:
        description: 'replays only — regenerate replay data that already exists'
        required: false
        type: boolean
        default: false
      target_database:
        description: 'Target database'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

concurrency:
  group: backfill-${{ inputs.target_database }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set environment variables
        run: |
          if [ "${{ inputs.target_database }}" = "prod" ]; then
            echo "DATABASE_URL=${{ secrets.NEON_PROD_DATABASE_URL }}" >> $GITHUB_ENV
          else
            echo "DATABASE_URL=${{ secrets.NEON_DEV_DATABASE_URL }}" >> $GITHUB_ENV
          fi
          echo "LAPWISE_API_KEY=${{ secrets.LAPWISE_API_KEY }}" >> $GITHUB_ENV
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> $GITHUB_ENV

      - name: Create cache directory
        run: mkdir -p backend/.fastf1_cache

      - name: Restore FastF1 cache
        uses: actions/cache@v4
        with:
          path: backend/.fastf1_cache
          key: fastf1-cache-live-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            fastf1-cache-live-
            fastf1-cache-

      - name: Run database migrations
        working-directory: ./backend
        run: alembic upgrade head

      - name: Backfill race control messages
        if: ${{ inputs.task == 'race-control' }}
        working-directory: ./backend
        run: |
          echo "Backfilling race control messages for ${{ inputs.years }}"
          PYTHONPATH=$PWD python scripts/backfill_race_control.py --years ${{ inputs.years }}

      - name: Generate replay data
        if: ${{ inputs.task == 'replays' }}
        working-directory: ./backend
        run: |
          if [ -z "${{ inputs.season }}" ]; then
            echo "❌ replays requires a season"
            exit 1
          fi
          echo "Generating replays for ${{ inputs.season }} ${{ inputs.round && format('R{0}', inputs.round) || '(full season)' }}"
          PYTHONPATH=$PWD python scripts/ingest_replays.py \
            ${{ inputs.season }} ${{ inputs.round }} ${{ inputs.force && '--force' || '' }}

      - name: Upload failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-logs-${{ inputs.task }}-${{ github.run_id }}
          path: backend/logs/
          retention-days: 30
          if-no-files-found: ignore
